<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚡ Speed Relay Tic-Tac-Toe 雙模式對抗 ⚡</title>
  
  <!-- 外部套件引入 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  
  <style>
    /* =========================================
       1. 全局設定與字體
       ========================================= */
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=M+PLUS+Rounded+1c:wght@700&display=swap');

    :root {
      --bg: #F0F3F8;
      --card-bg: #FFFFFF;
      --team-blue: #1E90FF;
      --team-red: #FF4757;
      --track-border: #2F3542;
      --gold: #FFA502;
      --green: #2ED573;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: 'Fredoka One', 'M PLUS Rounded 1c', sans-serif;
      background-color: var(--bg);
      color: #2F3542;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .main-container { width: 100%; max-width: 1150px; }

    /* =========================================
       2. 共用 UI 元件 (卡片、按鈕、輸入框)
       ========================================= */
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 20px 24px;
      box-shadow: 0 10px 0 #CBD5E1;
      border: 4px solid var(--track-border);
    }

    h1 { text-align: center; margin: 0 0 16px 0; color: var(--gold); font-size: 28px; }
    
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 16px; margin-bottom: 8px; font-weight: bold; }
    
    select, textarea, .share-url {
      width: 100%; padding: 14px;
      border: 3px solid #CBD5E1; border-radius: 14px;
      font-size: 18px; font-family: inherit; outline: none; margin-bottom: 12px;
    }

    .btn {
      background-color: var(--green); color: white;
      border: 3px solid var(--track-border); border-radius: 16px;
      padding: 12px 28px; font-size: 20px; font-family: inherit;
      cursor: pointer; box-shadow: 0 5px 0 #218C4A; transition: transform 0.1s;
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #218C4A; }

    /* =========================================
       3. 遊戲介面佈局 (頂部狀態與三區塊競技場)
       ========================================= */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #F8FAFC; border: 3.5px solid var(--track-border);
      border-radius: 18px; padding: 10px 20px; margin-bottom: 14px;
    }
    .team-badge { font-size: 20px; font-weight: bold; padding: 6px 18px; border-radius: 20px; color: white; }
    .badge-blue { background: var(--team-blue); }
    .badge-red { background: var(--team-red); }
    .status-text { font-size: 18px; font-weight: bold; color: #57606F; }

    .arena-layout {
      display: grid; grid-template-columns: 310px 1fr 310px; gap: 16px; align-items: center;
    }
    .team-side-box {
      background: #FFFFFF; border: 3.5px solid var(--track-border); border-radius: 20px;
      padding: 16px; text-align: center; display: flex; flex-direction: column;
      justify-content: space-between; min-height: 400px;
    }
    .side-title {
      font-size: 20px; font-weight: bold; margin-bottom: 10px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }

    /* =========================================
       4. 作答模式專屬樣式 (挖空拼字 vs 四選一)
       ========================================= */
    /* --- 挖空拼字 --- */
    .cloze-display {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
      gap: 6px; min-height: 60px; padding: 10px; border-bottom: 4px dashed #CBD5E1;
      margin-bottom: 16px; background: #F8FAFC; border-radius: 10px 10px 0 0;
    }
    .char-box { font-size: 34px; font-weight: bold; color: #3742FA; display: inline-flex; min-width: 24px; justify-content: center;}
    .char-box.filled { color: var(--green); }
    .char-box.empty { color: #3742FA; }
    
    .letters-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; padding: 0 8px; }
    .letter-btn {
      background: white; border: 3px solid var(--track-border); border-radius: 14px;
      font-size: 30px; font-weight: bold; padding: 14px 0; cursor: pointer;
      box-shadow: 0 5px 0 #CBD5E1; font-family: inherit; color: #2F3542; transition: transform 0.1s;
    }
    .letter-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #CBD5E1; }

    /* --- 四選一 --- */
    .four-choices-grid {
      display: none; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
      gap: 12px; height: 100%; padding: 10px 8px;
    }
    .choice-btn {
      background: #F8FAFC; border: 3px solid var(--track-border); border-radius: 16px;
      font-size: 24px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 0 #CBD5E1;
      font-family: inherit; color: #2F3542; transition: transform 0.1s;
      display: flex; align-items: center; justify-content: center; padding: 10px;
      white-space: nowrap; overflow: hidden; /* 確保超出不換行，由 JS 處理字體縮放 */
    }
    .choice-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #CBD5E1; }

    /* 錯誤震動特效 */
    .choice-btn.wrong, .letter-btn.wrong {
      background: #FF6B81 !important; color: white !important; border-color: #EE5253 !important;
      animation: shake 0.3s ease;
    }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

    /* =========================================
       5. 中央提示區與計時器
       ========================================= */
    .center-stage {
      display: flex; flex-direction: column; align-items: center;
      background: #FFFDF5; border: 3.5px solid var(--gold); border-radius: 22px; padding: 14px;
    }
    .quiz-info-box {
      text-align: center; margin-bottom: 12px; display: flex; flex-direction: column;
      align-items: center; gap: 8px; width: 100%;
    }
    .timer-display {
      font-size: 28px; color: var(--team-red); font-weight: bold; background: white;
      border: 3px solid var(--track-border); padding: 4px 16px; border-radius: 20px; box-shadow: 0 4px 0 #CBD5E1;
    }
    .hint-text {
      font-size: 24px; color: #E67E22; font-weight: bold; min-height: 34px;
      word-break: break-word; padding: 0 10px;
    }
    .controls-row { display: flex; gap: 10px; }

    /* =========================================
       6. 九宮格棋盤與立體棋子設計
       ========================================= */
    .board-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10px; width: 310px; height: 310px; }
    .cell {
      background: white; border: 3.5px solid var(--track-border); border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 5px 0 #CBD5E1; cursor: pointer; transition: transform 0.1s;
    }
    .cell:active { transform: translateY(2px); }

    /* 棋子基礎樣式 */
    .cell-token { transition: transform 0.2s, box-shadow 0.2s; }

    /* 藍隊：立體圓形 */
    .token-blue .cell-token {
      width: 75%; height: 75%; background: linear-gradient(135deg, #4A90E2, #0056b3);
      border-radius: 50%; box-shadow: 0 6px 0 rgba(0,0,0,0.2), inset 0 3px 8px rgba(255,255,255,0.4); border: 3px solid #004494;
    }

    /* 紅隊：立體十字 */
    .token-red .cell-token { width: 75%; height: 75%; position: relative; }
    .token-red .cell-token::before, .token-red .cell-token::after {
      content: ''; position: absolute; top: 5%; left: 40%; width: 20%; height: 90%;
      background: linear-gradient(135deg, #FF6B81, #C0392B); border-radius: 10px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2), inset 0 2px 5px rgba(255,255,255,0.4); border: 2px solid #96281B;
    }
    .token-red .cell-token::before { transform: rotate(45deg); }
    .token-red .cell-token::after { transform: rotate(-45deg); }

    /* 移子高亮特效 */
    .token-selectable { animation: pulse 0.6s infinite alternate; border-color: var(--gold) !important; background: #FFF8E1; }
    .token-selected { background: #DFF9FB !important; border-color: var(--green) !important; transform: scale(0.95); }
    .token-selected .cell-token { transform: translateY(4px); }
    @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.06); } }

    .guide-text { margin-top: 10px; font-size: 15px; font-weight: bold; color: #57606F; min-height: 22px; text-align: center; }

    /* =========================================
       7. 視窗與 QR Code 分享區
       ========================================= */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 100;
    }
    .modal-box {
      background: white; border: 4px solid var(--track-border); border-radius: 24px; padding: 24px; text-align: center; max-width: 380px; width: 90%;
    }
    .share-box { margin-top: 18px; padding: 16px; background: #F8FAFC; border: 3px solid #CBD5E1; border-radius: 16px; text-align: center; }
    .share-box h3 { margin: 0 0 10px; }
    .share-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
    .share-url { user-select: text; -webkit-user-select: text; font-size: 13px; padding: 10px; border-radius: 10px; }
    #qrCode { margin: 12px auto 0; display: flex; justify-content: center; min-height: 8px; }
  </style>
</head>
<body>

<div class="main-container">

  <!-- =========================================
       A. 後台設定面板 (Teacher Admin Panel)
       ========================================= -->
  <div class="card" id="adminPanel">
    <h1>⚙️ 接力九宮格對戰 ⚡</h1>
    
    <div class="form-group">
      <label>1. 選擇題型模式：</label>
      <select id="gameModeSelect">
        <option value="cloze">📝 挖空拼字 (適合中高年級)</option>
        <option value="choice">🎧 系統發音四選一 (適合低年級)</option>
        <!-- 修改：改為閱讀測驗模式 -->
        <option value="reading">📖 閱讀測驗四選一 (學生讀題，無發音)</option>
      </select>
    </div>
    
    <div class="form-group">
      <label>2. 建立題庫 (支援 CSV 匯入或手動輸入)：</label>
      <div style="margin-bottom: 10px; background: #F8FAFC; padding: 12px; border-radius: 14px; border: 2px dashed #CBD5E1;">
        <span style="font-size: 15px; color: #57606F; margin-right: 10px;">📁 自動解析「閱讀測驗」或「單字」CSV 檔：</span>
        <input type="file" id="csvFileInput" accept=".csv" style="font-size: 15px;">
      </div>
      <!-- 支援格式： 答案:題目:選項1|選項2 -->
      <textarea id="cfgWords" rows="8">apple:蘋果
Canada:Where does John live?:Canada|the U.S.|Japan|Taiwan</textarea>
    </div>
    
    <div style="text-align:center; margin-top:16px;">
      <button class="btn" onclick="saveAndStart()">🚀 進入大螢幕對戰</button>
    </div>

    <!-- QR Code 分享區 -->
    <div class="share-box">
      <h3>📱 分享本次題庫給學生</h3>
      <div>老師設定完成後，按「產生學生 QR Code」。學生掃描後會自動載入這次的題型與題庫。</div>
      <div class="share-actions">
        <button class="btn" style="background:#3742FA; box-shadow:0 5px 0 #1e272e;" onclick="generateStudentQR()">📷 產生學生 QR Code</button>
      </div>
      <div id="qrCode"></div>
      <input id="studentUrl" class="share-url" style="display:none;" readonly>
    </div>
  </div>

  <!-- =========================================
       B. 前台對戰面板 (Game Arena Panel)
       ========================================= -->
  <div class="card" id="gamePanel" style="display:none;">
    
    <!-- 狀態橫幅 -->
    <div class="top-bar">
      <div class="team-badge badge-blue">🔵 藍隊：<span id="tokensBlue">0</span>/3 子</div>
      <div class="status-text" id="topStatus">準備開始！</div>
      <div class="team-badge badge-red">🔴 紅隊：<span id="tokensRed">0</span>/3 子</div>
    </div>

    <div class="arena-layout">
      <!-- 藍隊區 -->
      <div class="team-side-box">
        <div class="side-title" style="color:var(--team-blue);"><span>🕹️</span> 藍隊作答區</div>
        <div class="cloze-display" id="blueDisplay"></div>
        <div class="letters-grid" id="blueKeyboard"></div>
        <div class="four-choices-grid" id="blueFourChoices"></div>
      </div>

      <!-- 中央舞台區 (題目、計時、九宮格) -->
      <div class="center-stage">
        <div class="quiz-info-box">
          <div class="timer-display" id="timerDisplay">🎯 作答中</div>
          <div class="hint-text" id="quizHint">蘋果</div>
          <div class="controls-row">
            <button class="btn" style="padding:6px 16px; font-size:15px; background:#3742FA; box-shadow:0 3px 0 #1e272e;" onclick="speakCurrentWord()">🔊 發音</button>
            <button class="btn" style="padding:6px 16px; font-size:15px; background:#747d8c; border-color:#57606f; box-shadow:0 3px 0 #2f3542;" onclick="skipQuiz()">⏭️ 換題</button>
          </div>
        </div>
        
        <div class="board-grid" id="boardGrid">
          <div class="cell" onclick="handleCellClick(0)"></div><div class="cell" onclick="handleCellClick(1)"></div><div class="cell" onclick="handleCellClick(2)"></div>
          <div class="cell" onclick="handleCellClick(3)"></div><div class="cell" onclick="handleCellClick(4)"></div><div class="cell" onclick="handleCellClick(5)"></div>
          <div class="cell" onclick="handleCellClick(6)"></div><div class="cell" onclick="handleCellClick(7)"></div><div class="cell" onclick="handleCellClick(8)"></div>
        </div>
        <div class="guide-text" id="guideText">雙方選手就位，看誰最快答對！</div>
      </div>

      <!-- 紅隊區 -->
      <div class="team-side-box">
        <div class="side-title" style="color:var(--team-red);"><span>🕹️</span> 紅隊作答區</div>
        <div class="cloze-display" id="redDisplay"></div>
        <div class="letters-grid" id="redKeyboard"></div>
        <div class="four-choices-grid" id="redFourChoices"></div>
      </div>
    </div>
  </div>
</div>

<!-- =========================================
     C. 勝利結算彈窗
     ========================================= -->
<div class="modal-overlay" id="winModal">
  <div class="modal-box">
    <div style="font-size:56px;">🏆</div>
    <h2 id="winTitle" style="font-size:26px; margin:8px 0;">藍隊獲勝！</h2>
    <p>率先在九宮格完成 3 點連線！</p>
    <button class="btn" onclick="restartMatch()">🔄 再玩一局</button>
  </div>
</div>

<script>
  /* =========================================
     JavaScript 核心邏輯區塊
     ========================================= */

  let wordBank = [];
  let currentTargetWord = "";
  let currentGameMode = "cloze"; 
  
  let timerInterval = null;
  let placementTimerInterval = null;
  let placementTimeLeft = 10; 

  let clozeData = { chars: [], indices: [], missing: [], options: [] };
  let choiceData = []; 
  let teamProgress = { 'blue': 0, 'red': 0 };
  let teamDisplayChars = { 'blue': [], 'red': [] };

  let board = Array(9).fill(null);
  let activeTurnTeam = null;
  let movingSourceIdx = null;
  let isAnsweringLocked = false;

  /* --- 模組 1: CSV 檔案解析 --- */
  function parseCSV(text) {
    let result = [], row = [], cell = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      let c = text[i];
      if (c === '"') {
        if (inQuotes && text[i + 1] === '"') { cell += '"'; i++; } 
        else { inQuotes = !inQuotes; }
      } else if (c === ',' && !inQuotes) {
        row.push(cell); cell = '';
      } else if ((c === '\n' || c === '\r') && !inQuotes) {
        if (c === '\r' && text[i + 1] === '\n') i++; 
        row.push(cell); result.push(row); row = []; cell = '';
      } else { cell += c; }
    }
    if (cell || row.length) { row.push(cell); result.push(row); }
    return result;
  }

  document.getElementById('csvFileInput').addEventListener('change', function(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      let text = e.target.result;
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); 

      const rows = parseCSV(text);
      if (rows.length < 2) { alert("找不到足夠的資料，請確認 CSV 內容。"); return; }

      const headers = rows[0].map(h => h.trim());
      const qIdx = headers.indexOf('題目'), aIdx = headers.indexOf('正確答案'), oIdx = headers.indexOf('選項');
      let parsedText = '';

      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (row.length < 2) continue;
        let en = '', hint = '', opts = '';
        
        if (qIdx !== -1 && aIdx !== -1) {
          en = row[aIdx] ? row[aIdx].trim() : '';
          hint = row[qIdx] ? row[qIdx].trim() : '';
          if (oIdx !== -1 && row[oIdx]) opts = row[oIdx].trim();
        } else {
          en = row[0] ? row[0].trim() : '';
          hint = row[1] ? row[1].trim() : '';
        }

        if (en) {
          if (opts) parsedText += `${en}:${hint}:${opts}\n`;
          else if (hint) parsedText += `${en}:${hint}\n`;
          else parsedText += `${en}\n`;
        }
      }
      document.getElementById('cfgWords').value = parsedText.trim();
      alert('✅ 題庫解析完成！請檢視下方清單。');
      event.target.value = ''; 
    };
    reader.readAsText(file, 'UTF-8');
  });

  /* --- 模組 2: QR Code 同步分享 --- */
  function getTeacherConfig() { return { mode: document.getElementById('gameModeSelect').value, words: document.getElementById('cfgWords').value }; }
  
  function encodeConfig(config) {
    const bytes = new TextEncoder().encode(JSON.stringify(config));
    let binary = '';
    bytes.forEach(b => binary += String.fromCharCode(b));
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
  }

  function decodeConfig(encoded) {
    let b64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0))));
  }

  function buildStudentUrl() {
    const url = new URL(window.location.href);
    url.search = ''; url.hash = '';
    url.searchParams.set('cfg', encodeConfig(getTeacherConfig()));
    url.searchParams.set('student', '1');
    return url.toString();
  }

  function generateStudentQR() {
    const raw = document.getElementById('cfgWords').value.split('\n').map(s => s.trim()).filter(Boolean);
    if (raw.length === 0) { alert("請至少輸入一筆資料！"); return; }
    
    const studentUrl = buildStudentUrl();
    const urlInput = document.getElementById('studentUrl');
    urlInput.value = studentUrl; urlInput.style.display = 'block';

    const qr = document.getElementById('qrCode');
    qr.innerHTML = '';
    if (typeof QRCode === 'function') {
      new QRCode(qr, { text: studentUrl, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
    } else {
      alert("QR Code 套件尚未載入，請確認網路連線。");
    }
  }

  function loadConfigFromUrl() {
    const params = new URLSearchParams(window.location.search);
    const encoded = params.get('cfg');
    if (!encoded) return false;

    try {
      const config = decodeConfig(encoded);
      // 更新允許的模式，加入 reading
      if (['cloze', 'choice', 'reading'].includes(config.mode)) document.getElementById('gameModeSelect').value = config.mode;
      if (typeof config.words === 'string') document.getElementById('cfgWords').value = config.words;
      if (params.get('student') === '1') saveAndStart();
      return true;
    } catch (err) { console.error("解析失敗：", err); return false; }
  }

  /* --- 模組 3: 遊戲初始化與換題邏輯 --- */
  function saveAndStart() {
    currentGameMode = document.getElementById('gameModeSelect').value;
    const raw = document.getElementById('cfgWords').value.split('\n').map(s => s.trim()).filter(Boolean);
    
    wordBank = raw.map(line => {
      const parts = line.split(':');
      let en = parts[0].trim(), hint = "看提示作答", options = null;
      if (parts.length === 2) { hint = parts[1].trim(); } 
      else if (parts.length >= 3) {
        options = parts.pop().split('|').map(s => s.trim());
        hint = parts.slice(1).join(':').trim();
      }
      return { en, hint, options };
    });

    if (wordBank.length === 0) { alert("請至少輸入一筆資料！"); return; }
    
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('gamePanel').style.display = 'block';
    
    if (currentGameMode === 'choice' || currentGameMode === 'reading') {
      document.querySelectorAll('.cloze-display, .letters-grid').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.four-choices-grid').forEach(el => el.style.display = 'grid');
      // 修改：依據不同模式顯示頂部提示
      document.getElementById('topStatus').innerText = currentGameMode === 'reading' ? "請仔細閱讀題目，選出正確答案！" : "聽系統發音，選出正確的答案！";
    } else {
      document.querySelectorAll('.cloze-display').forEach(el => el.style.display = 'flex');
      document.querySelectorAll('.letters-grid').forEach(el => el.style.display = 'grid');
      document.querySelectorAll('.four-choices-grid').forEach(el => el.style.display = 'none');
      document.getElementById('topStatus').innerText = "看提示並聽發音，填滿缺漏字母！";
    }
    restartMatch();
  }

  function restartMatch() {
    clearInterval(placementTimerInterval);
    board = Array(9).fill(null);
    activeTurnTeam = null; movingSourceIdx = null; isAnsweringLocked = false;
    document.getElementById('winModal').style.display = 'none';
    updateBoardUI(); loadNextQuiz();
  }
  
  function skipQuiz() { if(!isAnsweringLocked) loadNextQuiz(); }

  /* --- 模組 4: 資料生成邏輯 (挖空與干擾項) --- */
  function generateCloze(word) {
    word = word.toLowerCase();
    let chars = word.split(''), indices = [], blankCount = word.length <= 3 ? 1 : (word.length <= 6 ? 2 : 3);
    let candidates = [];
    for(let i = 1; i < word.length; i++) candidates.push(i);
    if(candidates.length === 0) candidates = [0]; 
    candidates.sort(() => Math.random() - 0.5);
    for(let i = 0; i < blankCount && i < candidates.length; i++) indices.push(candidates[i]);
    indices.sort((a,b) => a - b); 

    let missing = [];
    indices.forEach(idx => { missing.push(chars[idx]); chars[idx] = '_'; });
    let options = [...missing];
    const alphabet = "abcdefghijklmnopqrstuvwxyz";
    while(options.length < 6) {
      let randChar = alphabet[Math.floor(Math.random() * alphabet.length)];
      if (!options.includes(randChar)) options.push(randChar);
    }
    options.sort(() => Math.random() - 0.5); 
    return { chars, indices, missing, options };
  }

  function generateFourChoices(wordObj) {
    if (wordObj.options && wordObj.options.length >= 4) {
      let opts = [...wordObj.options].sort(() => Math.random() - 0.5);
      return opts.slice(0, 4);
    }
    let correctWord = wordObj.en, options = [correctWord];
    let pool = wordBank.map(w => w.en).filter(w => w !== correctWord).sort(() => Math.random() - 0.5);
    for(let i = 0; i < 3 && i < pool.length; i++) options.push(pool[i]);
    return options.sort(() => Math.random() - 0.5);
  }

  function loadNextQuiz() {
    clearInterval(placementTimerInterval);
    activeTurnTeam = null; movingSourceIdx = null; isAnsweringLocked = false;
    document.getElementById('guideText').innerText = "👉 雙方選手就位！誰先答對就能落子！";
    document.getElementById('timerDisplay').innerText = "🎯 作答中";

    currentTargetWord = wordBank[Math.floor(Math.random() * wordBank.length)];
    
    if (currentGameMode === 'choice' || currentGameMode === 'reading') {
      // 修改：若是閱讀測驗模式，或該題本身有專屬選項，皆直接顯示題目文字
      if (currentGameMode === 'reading' || currentTargetWord.options) {
        document.getElementById('quizHint').innerText = currentTargetWord.hint;
      } else {
        document.getElementById('quizHint').innerText = "Listen carefully! 🎧";
      }
      
      choiceData = generateFourChoices(currentTargetWord);
      buildChoices('blue'); buildChoices('red');
    } else {
      document.getElementById('quizHint').innerText = currentTargetWord.hint;
      clozeData = generateCloze(currentTargetWord.en);
      teamProgress['blue'] = 0; teamProgress['red'] = 0;
      teamDisplayChars['blue'] = [...clozeData.chars]; teamDisplayChars['red'] = [...clozeData.chars];
      updateClozeDisplay('blue'); updateClozeDisplay('red');
      buildKeyboard('blue'); buildKeyboard('red');
    }

    // 修改：只有在「非」閱讀測驗模式下，才會自動發音
    if (currentGameMode !== 'reading') speakCurrentWord();
  }

  /* --- 模組 5: UI 渲染與點擊判定 --- */
  function autoFitText(element) {
    let fontSize = 24; element.style.fontSize = fontSize + 'px';
    while (element.scrollWidth > element.clientWidth && fontSize > 12) {
      fontSize--; element.style.fontSize = fontSize + 'px';
    }
  }

  // 四選一模式
  function buildChoices(team) {
    const grid = document.getElementById(team + 'FourChoices'); grid.innerHTML = ''; 
    choiceData.forEach(wordStr => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn'; btn.innerText = wordStr;
      btn.onclick = () => handleChoiceClick(team, btn, wordStr);
      grid.appendChild(btn); autoFitText(btn); 
    });
  }

  function handleChoiceClick(team, btn, selectedWord) {
    if (isAnsweringLocked) return;
    if (selectedWord === currentTargetWord.en) {
      btn.style.background = 'var(--green)'; btn.style.color = 'white'; btn.style.borderColor = '#218C4A';
      triggerCorrectAnswer(team);
    } else {
      btn.classList.add('wrong'); setTimeout(() => btn.classList.remove('wrong'), 300);
    }
  }

  // 挖空模式
  function updateClozeDisplay(team) {
    const display = document.getElementById(team + 'Display');
    display.innerHTML = teamDisplayChars[team].map((char, idx) => {
      if (char === '_') return `<span class="char-box empty">_</span>`;
      else if (clozeData.indices.includes(idx)) return `<span class="char-box filled">${char}</span>`;
      else return `<span class="char-box">${char}</span>`;
    }).join(''); 
  }

  function buildKeyboard(team) {
    const kb = document.getElementById(team + 'Keyboard'); kb.innerHTML = '';
    clozeData.options.forEach(l => {
      const btn = document.createElement('button');
      btn.className = 'letter-btn'; btn.innerText = l;
      btn.onclick = () => handleClozeClick(team, btn, l);
      kb.appendChild(btn);
    });
  }

  function handleClozeClick(team, btn, char) {
    if (isAnsweringLocked) return;
    let expectedChar = clozeData.missing[teamProgress[team]];
    if (char === expectedChar) {
      teamDisplayChars[team][clozeData.indices[teamProgress[team]]] = char;
      teamProgress[team]++; updateClozeDisplay(team);
      if (teamProgress[team] === clozeData.missing.length) triggerCorrectAnswer(team);
    } else {
      btn.classList.add('wrong'); setTimeout(() => btn.classList.remove('wrong'), 300);
    }
  }

  /* --- 模組 6: 回饋、計時與九宮格控制 --- */
  function triggerCorrectAnswer(team) {
    isAnsweringLocked = true; activeTurnTeam = team === 'blue' ? 'BLUE' : 'RED';
    if ('speechSynthesis' in window) { try { window.speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance("Good job!"), {lang:'en-US'})); } catch(e){} }
    grantPlacementTurn(activeTurnTeam);
  }

  function speakCurrentWord() {
    if ('speechSynthesis' in window && currentTargetWord) {
      try { window.speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(currentTargetWord.en), {lang:'en-US', rate: currentGameMode === 'choice' ? 0.75 : 0.85})); } 
      catch (e) { console.log("語音播放暫時無法使用"); }
    }
  }

  function startPlacementTimer() {
    clearInterval(placementTimerInterval);
    placementTimeLeft = 10;
    document.getElementById('timerDisplay').innerText = `⏳ 擺棋 ${placementTimeLeft}`;
    placementTimerInterval = setInterval(() => {
      placementTimeLeft--;
      document.getElementById('timerDisplay').innerText = `⏳ 擺棋 ${placementTimeLeft}`;
      if (placementTimeLeft <= 0) {
        clearInterval(placementTimerInterval);
        document.getElementById('guideText').innerText = "⏰ 擺棋時間到！換下一題！";
        updateBoardUI(); setTimeout(loadNextQuiz, 600);
      }
    }, 1000);
  }

  function grantPlacementTurn(team) {
    const isBlue = team === 'BLUE', teamName = isBlue ? '🔵 藍隊' : '🔴 紅隊', count = getTokensCount(team);
    startPlacementTimer(); 
    document.getElementById('guideText').innerText = count < 3 ? `👉 ${teamName} 答對！場上有 ${count}/3 子，請點任一【空白格】放棋子！` : `⚠️ ${teamName} 答對！已滿 3 子，請先點自己的【舊棋子】進行移動！`;
    updateBoardUI();
  }

  function handleCellClick(index) {
    if (!activeTurnTeam) return;
    const count = getTokensCount(activeTurnTeam);
    if (count < 3) {
      if (board[index] === null) { board[index] = activeTurnTeam; finalizeMove(); }
    } else if (count === 3) {
      if (movingSourceIdx === null) {
        if (board[index] === activeTurnTeam) {
          movingSourceIdx = index;
          document.getElementById('guideText').innerText = "已選定棋子！請點任一【空白格】完成移動！";
          updateBoardUI();
        }
      } else {
        if (board[index] === null) {
          board[movingSourceIdx] = null; board[index] = activeTurnTeam; movingSourceIdx = null; finalizeMove();
        } else if (board[index] === activeTurnTeam) {
          movingSourceIdx = index; updateBoardUI();
        }
      }
    }
  }

  function finalizeMove() {
    clearInterval(placementTimerInterval); updateBoardUI();
    if (checkWin(activeTurnTeam)) triggerWin(activeTurnTeam);
    else loadNextQuiz();
  }

  function triggerWin(team) {
    clearInterval(placementTimerInterval);
    document.getElementById('winTitle').innerText = team === 'BLUE' ? '🔵 藍隊獲勝！' : '🔴 紅隊獲勝！';
    document.getElementById('winModal').style.display = 'flex';
    if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 180, origin: { y: 0.1 }, colors: team === 'BLUE' ? ['#1E90FF', '#ffffff', '#4A90E2'] : ['#FF4757', '#ffffff', '#FF6B81'] });
  }

  function getTokensCount(team) { return board.filter(c => c === team).length; }

  function updateBoardUI() {
    document.getElementById('tokensBlue').innerText = getTokensCount('BLUE');
    document.getElementById('tokensRed').innerText = getTokensCount('RED');
    const cells = document.querySelectorAll('.cell');
    cells.forEach((cell, idx) => {
      cell.className = 'cell'; cell.innerHTML = ''; 
      if (board[idx] === 'BLUE') {
        cell.classList.add('token-blue'); cell.innerHTML = '<div class="cell-token"></div>'; 
      } else if (board[idx] === 'RED') {
        cell.classList.add('token-red'); cell.innerHTML = '<div class="cell-token"></div>'; 
      }
      if (activeTurnTeam && getTokensCount(activeTurnTeam) === 3) {
        if (movingSourceIdx === null && board[idx] === activeTurnTeam) cell.classList.add('token-selectable');
        else if (movingSourceIdx === idx) cell.classList.add('token-selected');
      }
    });
  }

  function checkWin(team) {
    const lines = [ [0,1,2],[3,4,5],[6,7,8], [0,3,6],[1,4,7],[2,5,8], [0,4,8],[2,4,6] ];
    return lines.some(([a, b, c]) => board[a] === team && board[b] === team && board[c] === team);
  }

  // 網頁載入時嘗試讀取分享參數
  window.addEventListener('DOMContentLoaded', () => { loadConfigFromUrl(); });
</script>
