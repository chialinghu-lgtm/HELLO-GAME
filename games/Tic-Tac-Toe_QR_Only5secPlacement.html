<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚡ Speed Relay Tic-Tac-Toe 雙模式對抗 ⚡</title>
  <!-- 引入全螢幕灑花特效套件 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=M+PLUS+Rounded+1c:wght@700&display=swap');

    :root {
      --bg: #F0F3F8;
      --card-bg: #FFFFFF;
      --team-blue: #1E90FF;
      --team-red: #FF4757;
      --track-border: #2F3542;
      --gold: #FFA502;
      --green: #2ED573;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: 'Fredoka One', 'M PLUS Rounded 1c', sans-serif;
      background-color: var(--bg);
      color: #2F3542;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .main-container {
      width: 100%;
      max-width: 1150px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 20px 24px;
      box-shadow: 0 10px 0 #CBD5E1;
      border: 4px solid var(--track-border);
    }

    h1 {
      text-align: center;
      margin: 0 0 16px 0;
      color: var(--gold);
      font-size: 28px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 16px;
      margin-bottom: 8px;
      font-weight: bold;
    }
    
    select, textarea {
      width: 100%;
      padding: 14px;
      border: 3px solid #CBD5E1;
      border-radius: 14px;
      font-size: 18px;
      font-family: inherit;
      outline: none;
      margin-bottom: 12px;
    }

    .btn {
      background-color: var(--green);
      color: white;
      border: 3px solid var(--track-border);
      border-radius: 16px;
      padding: 12px 28px;
      font-size: 20px;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 5px 0 #218C4A;
      transition: transform 0.1s;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #218C4A;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #F8FAFC;
      border: 3.5px solid var(--track-border);
      border-radius: 18px;
      padding: 10px 20px;
      margin-bottom: 14px;
    }

    .team-badge {
      font-size: 20px;
      font-weight: bold;
      padding: 6px 18px;
      border-radius: 20px;
      color: white;
    }

    .badge-blue { background: var(--team-blue); }
    .badge-red { background: var(--team-red); }

    .status-text {
      font-size: 18px;
      font-weight: bold;
      color: #57606F;
    }

    .arena-layout {
      display: grid;
      grid-template-columns: 310px 1fr 310px;
      gap: 16px;
      align-items: center;
    }

    .team-side-box {
      background: #FFFFFF;
      border: 3.5px solid var(--track-border);
      border-radius: 20px;
      padding: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 400px;
    }

    .side-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* 挖空拼字介面 */
    .cloze-display {
      display: flex;
      flex-wrap: wrap; 
      align-items: center;
      justify-content: center;
      gap: 6px; 
      min-height: 60px;
      padding: 10px;
      border-bottom: 4px dashed #CBD5E1;
      margin-bottom: 16px;
      background: #F8FAFC;
      border-radius: 10px 10px 0 0;
    }

    .char-box {
      font-size: 34px;
      font-weight: bold;
      color: #3742FA;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
    }

    .char-box.filled { color: var(--green); }
    .char-box.empty { color: #3742FA; }

    .letters-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px; 
      width: 100%;
      padding: 0 8px;
    }

    /* 四選一介面 */
    .four-choices-grid {
      display: none; 
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      height: 100%;
      padding: 10px 8px;
    }

    .choice-btn {
      background: #F8FAFC;
      border: 3px solid var(--track-border);
      border-radius: 16px;
      font-size: 24px; 
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 0 #CBD5E1;
      font-family: inherit;
      color: #2F3542;
      transition: transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      /* 強制單行顯示，超出隱藏，交由 JS 處理字體縮放 */
      white-space: nowrap; 
      overflow: hidden; 
    }
    
    .choice-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #CBD5E1;
    }

    .choice-btn.wrong, .letter-btn.wrong {
      background: #FF6B81 !important;
      color: white !important;
      border-color: #EE5253 !important;
      animation: shake 0.3s ease;
    }

    .letter-btn {
      background: white;
      border: 3px solid var(--track-border);
      border-radius: 14px;
      font-size: 30px;
      font-weight: bold;
      padding: 14px 0;
      cursor: pointer;
      box-shadow: 0 5px 0 #CBD5E1;
      font-family: inherit;
      color: #2F3542;
      transition: transform 0.1s;
    }
    
    .letter-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #CBD5E1;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    /* 中央九宮格舞台 */
    .center-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #FFFDF5;
      border: 3.5px solid var(--gold);
      border-radius: 22px;
      padding: 14px;
    }

    .quiz-info-box {
      text-align: center;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    /* 計時器樣式 */
    .timer-display {
      font-size: 28px;
      color: var(--team-red);
      font-weight: bold;
      background: white;
      border: 3px solid var(--track-border);
      padding: 4px 16px;
      border-radius: 20px;
      box-shadow: 0 4px 0 #CBD5E1;
    }

    .hint-text {
      font-size: 26px;
      color: #E67E22;
      font-weight: bold;
      min-height: 34px;
    }
    
    .controls-row {
      display: flex;
      gap: 10px;
    }

    /* 3x3 九宮格棋盤 */
    .board-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      width: 310px;
      height: 310px;
    }

    .cell {
      background: white;
      border: 3.5px solid var(--track-border);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 0 #CBD5E1;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .cell:active { transform: translateY(2px); }

    /* 立體幾何棋子形狀 */
    .cell-token { transition: transform 0.2s, box-shadow 0.2s; }

    .token-blue .cell-token {
      width: 75%; height: 75%;
      background: linear-gradient(135deg, #4A90E2, #0056b3);
      border-radius: 50%;
      box-shadow: 0 6px 0 rgba(0,0,0,0.2), inset 0 3px 8px rgba(255,255,255,0.4);
      border: 3px solid #004494;
    }

    .token-red .cell-token {
      width: 75%; height: 75%; position: relative;
    }
    
    .token-red .cell-token::before, .token-red .cell-token::after {
      content: ''; position: absolute;
      top: 5%; left: 40%; width: 20%; height: 90%;
      background: linear-gradient(135deg, #FF6B81, #C0392B);
      border-radius: 10px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2), inset 0 2px 5px rgba(255,255,255,0.4);
      border: 2px solid #96281B;
    }

    .token-red .cell-token::before { transform: rotate(45deg); }
    .token-red .cell-token::after { transform: rotate(-45deg); }

    .token-selectable {
      animation: pulse 0.6s infinite alternate;
      border-color: var(--gold) !important;
      background: #FFF8E1;
    }

    .token-selected {
      background: #DFF9FB !important;
      border-color: var(--green) !important;
      transform: scale(0.95);
    }
    
    .token-selected .cell-token { transform: translateY(4px); }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }

    .guide-text {
      margin-top: 10px;
      font-size: 15px;
      font-weight: bold;
      color: #57606F;
      min-height: 22px;
      text-align: center;
    }

    .modal-overlay {
      display: none; position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      justify-content: center; align-items: center; z-index: 100;
    }

    .modal-box {
      background: white; border: 4px solid var(--track-border);
      border-radius: 24px; padding: 24px; text-align: center;
      max-width: 380px; width: 90%;
    }

    /* QR Code 分享設定 */
    .share-box {
      margin-top: 18px;
      padding: 16px;
      background: #F8FAFC;
      border: 3px solid #CBD5E1;
      border-radius: 16px;
      text-align: center;
    }
    .share-box h3 { margin: 0 0 10px; }
    .share-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .share-url {
      width: 100%;
      padding: 10px;
      border: 2px solid #CBD5E1;
      border-radius: 10px;
      font-size: 13px;
      user-select: text;
      -webkit-user-select: text;
    }
    #qrCode {
      margin: 12px auto 0;
      display: flex;
      justify-content: center;
      min-height: 8px;
    }

  </style>
</head>
<body>

<div class="main-container">

  <!-- 後台設定 -->
  <div class="card" id="adminPanel">
    <h1>⚙️ 接力九宮格對戰 ⚡</h1>
    <div class="form-group">
      <label>1. 選擇題型模式：</label>
      <select id="gameModeSelect">
        <option value="cloze">📝 挖空拼字 (適合中高年級)</option>
        <option value="choice">🎧 聽音四選一 (適合低年級)</option>
      </select>
    </div>
    <div class="form-group">
      <label>2. 單字清單（每行一題，格式「英文:中文提示」）：</label>
      <!-- 提示：四選一模式請務必至少輸入 4 個不同的單字 -->
      <textarea id="cfgWords" rows="8">apple:蘋果
banana:香蕉
cat:貓咪
dog:狗狗
elephant:大象
hippopotamus:河馬
fish:魚</textarea>
    </div>
    <div style="text-align:center; margin-top:16px;">
      <button class="btn" onclick="saveAndStart()">🚀 進入大螢幕對戰</button>
    </div>

    <div class="share-box">
      <h3>📱 分享本次題庫給學生</h3>
      <div>老師設定完成後，按「產生學生 QR Code」。學生掃描後會自動載入這次的題型與題庫。</div>
      <div class="share-actions">
        <button class="btn" style="background:#3742FA; box-shadow:0 5px 0 #1e272e;" onclick="generateStudentQR()">📷 產生學生 QR Code</button>
      </div>
      <div id="qrCode"></div>
      <input id="studentUrl" class="share-url" style="display:none;" readonly>
    </div>
  </div>

  <!-- 前台大螢幕對戰畫面 -->
  <div class="card" id="gamePanel" style="display:none;">
    <div class="top-bar">
      <div class="team-badge badge-blue">🔵 藍隊：<span id="tokensBlue">0</span>/3 子</div>
      <div class="status-text" id="topStatus">準備開始！</div>
      <div class="team-badge badge-red">🔴 紅隊：<span id="tokensRed">0</span>/3 子</div>
    </div>

    <div class="arena-layout">
      <!-- 左側：藍隊作答區 -->
      <div class="team-side-box">
        <div class="side-title" style="color:var(--team-blue);">
          <span>🕹️</span> 藍隊作答區
        </div>
        <!-- 挖空模式介面 -->
        <div class="cloze-display" id="blueDisplay"></div>
        <div class="letters-grid" id="blueKeyboard"></div>
        <!-- 四選一模式介面 -->
        <div class="four-choices-grid" id="blueFourChoices"></div>
      </div>

      <!-- 中央：提示、語音與 3x3 九宮格 -->
      <div class="center-stage">
        <div class="quiz-info-box">
          <div class="timer-display" id="timerDisplay">🎯 作答中</div>
          <div class="hint-text" id="quizHint">蘋果</div>
          <div class="controls-row">
            <button class="btn" style="padding:6px 16px; font-size:15px; background:#3742FA; box-shadow:0 3px 0 #1e272e;" onclick="speakCurrentWord()">🔊 發音</button>
            <button class="btn" style="padding:6px 16px; font-size:15px; background:#747d8c; border-color:#57606f; box-shadow:0 3px 0 #2f3542;" onclick="skipQuiz()">⏭️ 換題</button>
          </div>
        </div>

        <div class="board-grid" id="boardGrid">
          <div class="cell" onclick="handleCellClick(0)"></div>
          <div class="cell" onclick="handleCellClick(1)"></div>
          <div class="cell" onclick="handleCellClick(2)"></div>
          <div class="cell" onclick="handleCellClick(3)"></div>
          <div class="cell" onclick="handleCellClick(4)"></div>
          <div class="cell" onclick="handleCellClick(5)"></div>
          <div class="cell" onclick="handleCellClick(6)"></div>
          <div class="cell" onclick="handleCellClick(7)"></div>
          <div class="cell" onclick="handleCellClick(8)"></div>
        </div>

        <div class="guide-text" id="guideText">雙方選手就位，看誰最快答對！</div>
      </div>

      <!-- 右側：紅隊作答區 -->
      <div class="team-side-box">
        <div class="side-title" style="color:var(--team-red);">
          <span>🕹️</span> 紅隊作答區
        </div>
        <!-- 挖空模式介面 -->
        <div class="cloze-display" id="redDisplay"></div>
        <div class="letters-grid" id="redKeyboard"></div>
        <!-- 四選一模式介面 -->
        <div class="four-choices-grid" id="redFourChoices"></div>
      </div>
    </div>
  </div>

</div>

<!-- 獲勝結算視窗 -->
<div class="modal-overlay" id="winModal">
  <div class="modal-box">
    <div style="font-size:56px;">🏆</div>
    <h2 id="winTitle" style="font-size:26px; margin:8px 0;">藍隊獲勝！</h2>
    <p>率先在九宮格完成 3 點連線！</p>
    <button class="btn" onclick="restartMatch()">🔄 再玩一局</button>
  </div>
</div>

<script>
  let wordBank = [];
  let currentTargetWord = "";
  let currentGameMode = "cloze"; 
  
  // 計時器變數
  let timerInterval = null;
  let timeLeft = 15;
  let placementTimerInterval = null;
  let placementTimeLeft = 5;

  let clozeData = { chars: [], indices: [], missing: [], options: [] };
  let choiceData = []; 

  let teamProgress = { 'blue': 0, 'red': 0 };
  let teamDisplayChars = { 'blue': [], 'red': [] };

  let board = Array(9).fill(null);
  let activeTurnTeam = null;
  let movingSourceIdx = null;
  let isAnsweringLocked = false;


  // --- 老師設定 → URL → 學生掃碼同步 ---
  function getTeacherConfig() {
    return {
      mode: document.getElementById('gameModeSelect').value,
      words: document.getElementById('cfgWords').value
    };
  }

  function encodeConfig(config) {
    // UTF-8 safe Base64URL
    const bytes = new TextEncoder().encode(JSON.stringify(config));
    let binary = '';
    bytes.forEach(b => binary += String.fromCharCode(b));
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
  }

  function decodeConfig(encoded) {
    let b64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const binary = atob(b64);
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  function buildStudentUrl() {
    const url = new URL(window.location.href);
    url.search = '';
    url.hash = '';
    url.searchParams.set('cfg', encodeConfig(getTeacherConfig()));
    url.searchParams.set('student', '1');
    return url.toString();
  }

  function generateStudentQR() {
    const raw = document.getElementById('cfgWords').value
      .split('\n').map(s => s.trim()).filter(Boolean);

    if (raw.length === 0) {
      alert("請至少輸入一個單字！");
      return;
    }
    if (document.getElementById('gameModeSelect').value === 'choice' && raw.length < 4) {
      alert("⚠️ 聽音四選一模式至少需要 4 個不同的單字！");
      return;
    }

    const studentUrl = buildStudentUrl();
    const urlInput = document.getElementById('studentUrl');
    urlInput.value = studentUrl;
    urlInput.style.display = 'block';

    const qr = document.getElementById('qrCode');
    qr.innerHTML = '';

    if (typeof QRCode === 'function') {
      new QRCode(qr, {
        text: studentUrl,
        width: 220,
        height: 220,
        correctLevel: QRCode.CorrectLevel.M
      });
    } else {
      alert("QR Code 套件尚未載入，請確認網路連線。");
    }
  }

  function loadConfigFromUrl() {
    const params = new URLSearchParams(window.location.search);
    const encoded = params.get('cfg');
    if (!encoded) return false;

    try {
      const config = decodeConfig(encoded);
      if (config.mode === 'cloze' || config.mode === 'choice') {
        document.getElementById('gameModeSelect').value = config.mode;
      }
      if (typeof config.words === 'string') {
        document.getElementById('cfgWords').value = config.words;
      }

      // 學生掃 QR Code 後直接進入完全相同設定的遊戲
      if (params.get('student') === '1') {
        saveAndStart();
      }
      return true;
    } catch (err) {
      console.error("無法讀取分享設定：", err);
      alert("分享連結中的題庫設定無法讀取，請請老師重新產生 QR Code。");
      return false;
    }
  }

  function saveAndStart() {
    currentGameMode = document.getElementById('gameModeSelect').value;
    const raw = document.getElementById('cfgWords').value.split('\n').map(s => s.trim()).filter(Boolean);
    wordBank = raw.map(line => {
      const parts = line.split(':');
      return {
        en: parts[0].trim().toLowerCase(),
        hint: parts[1] ? parts[1].trim() : "聽發音作答"
      };
    });

    if (wordBank.length === 0) {
      alert("請至少輸入一個單字！");
      return;
    }
    
    if (currentGameMode === 'choice' && wordBank.length < 4) {
      alert("⚠️ 聽音四選一模式需要題庫中至少有 4 個不同的單字才能產生選項，請補充單字！");
      return;
    }

    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('gamePanel').style.display = 'block';
    
    if (currentGameMode === 'choice') {
      document.querySelectorAll('.cloze-display, .letters-grid').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.four-choices-grid').forEach(el => el.style.display = 'grid');
      document.getElementById('topStatus').innerText = "聽發音，選出正確的單字！";
    } else {
      document.querySelectorAll('.cloze-display').forEach(el => el.style.display = 'flex');
      document.querySelectorAll('.letters-grid').forEach(el => el.style.display = 'grid');
      document.querySelectorAll('.four-choices-grid').forEach(el => el.style.display = 'none');
      document.getElementById('topStatus').innerText = "看提示並聽發音，填滿缺漏字母！";
    }

    restartMatch();
  }

  function restartMatch() {
    clearInterval(placementTimerInterval);
    board = Array(9).fill(null);
    activeTurnTeam = null;
    movingSourceIdx = null;
    isAnsweringLocked = false;
    document.getElementById('winModal').style.display = 'none';
    updateBoardUI();
    loadNextQuiz();
  }
  
  function skipQuiz() {
    if(!isAnsweringLocked) {
      loadNextQuiz();
    }
  }

  function startTimer() {
    // 作答階段不計時：保留函式以相容原本流程
    clearInterval(timerInterval);
    document.getElementById('timerDisplay').innerText = "🎯 作答中";
  }

  function generateCloze(word) {
    let chars = word.split('');
    let indices = [];
    let blankCount = word.length <= 3 ? 1 : (word.length <= 6 ? 2 : 3);
    
    let candidates = [];
    for(let i = 1; i < word.length; i++) candidates.push(i);
    if(candidates.length === 0) candidates = [0]; 
    
    candidates.sort(() => Math.random() - 0.5);
    for(let i = 0; i < blankCount && i < candidates.length; i++) {
      indices.push(candidates[i]);
    }
    indices.sort((a,b) => a - b); 

    let missing = [];
    indices.forEach(idx => {
      missing.push(chars[idx]);
      chars[idx] = '_';
    });

    let options = [...missing];
    const alphabet = "abcdefghijklmnopqrstuvwxyz";
    while(options.length < 6) {
      let randChar = alphabet[Math.floor(Math.random() * alphabet.length)];
      if (!options.includes(randChar)) {
        options.push(randChar);
      }
    }
    options.sort(() => Math.random() - 0.5); 
    return { chars, indices, missing, options };
  }

  function generateFourChoices(correctWord) {
    let options = [correctWord];
    let pool = wordBank.map(w => w.en).filter(w => w !== correctWord);
    pool.sort(() => Math.random() - 0.5);
    for(let i = 0; i < 3 && i < pool.length; i++) {
      options.push(pool[i]);
    }
    options.sort(() => Math.random() - 0.5);
    return options;
  }

  function loadNextQuiz() {
    clearInterval(placementTimerInterval);
    activeTurnTeam = null;
    movingSourceIdx = null;
    isAnsweringLocked = false;
    document.getElementById('guideText').innerText = "👉 雙方選手就位！誰先答對就能落子！";

    currentTargetWord = wordBank[Math.floor(Math.random() * wordBank.length)];
    
    if (currentGameMode === 'choice') {
      document.getElementById('quizHint').innerText = "Listen carefully! 🎧";
      choiceData = generateFourChoices(currentTargetWord.en);
      buildChoices('blue');
      buildChoices('red');
    } else {
      document.getElementById('quizHint').innerText = currentTargetWord.hint;
      clozeData = generateCloze(currentTargetWord.en);
      teamProgress['blue'] = 0;
      teamProgress['red'] = 0;
      teamDisplayChars['blue'] = [...clozeData.chars];
      teamDisplayChars['red'] = [...clozeData.chars];
      updateClozeDisplay('blue');
      updateClozeDisplay('red');
      buildKeyboard('blue');
      buildKeyboard('red');
    }

    startTimer(); 
    speakCurrentWord();
  }

  /* --- 自動縮小字體機制 --- */
  function autoFitText(element) {
    let fontSize = 24; 
    element.style.fontSize = fontSize + 'px';
    
    while (element.scrollWidth > element.clientWidth && fontSize > 12) {
      fontSize--;
      element.style.fontSize = fontSize + 'px';
    }
  }

  /* --- 四選一專用渲染 --- */
  function buildChoices(team) {
    const grid = document.getElementById(team + 'FourChoices');
    grid.innerHTML = ''; 
    
    choiceData.forEach(wordStr => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerText = wordStr;
      btn.onclick = () => handleChoiceClick(team, btn, wordStr);
      grid.appendChild(btn); 
      
      autoFitText(btn); 
    });
  }

  function handleChoiceClick(team, btn, selectedWord) {
    if (isAnsweringLocked) return;
    
    if (selectedWord === currentTargetWord.en) {
      btn.style.background = 'var(--green)';
      btn.style.color = 'white';
      btn.style.borderColor = '#218C4A';
      triggerCorrectAnswer(team);
    } else {
      btn.classList.add('wrong');
      setTimeout(() => btn.classList.remove('wrong'), 300);
    }
  }

  /* --- 挖空拼字專用渲染 --- */
  function updateClozeDisplay(team) {
    const display = document.getElementById(team + 'Display');
    display.innerHTML = teamDisplayChars[team].map((char, index) => {
      if (char === '_') return `<span class="char-box empty">_</span>`;
      else if (clozeData.indices.includes(index)) return `<span class="char-box filled">${char}</span>`;
      else return `<span class="char-box">${char}</span>`;
    }).join(''); 
  }

  function buildKeyboard(team) {
    const kb = document.getElementById(team + 'Keyboard');
    kb.innerHTML = '';
    clozeData.options.forEach(l => {
      const btn = document.createElement('button');
      btn.className = 'letter-btn';
      btn.innerText = l;
      btn.onclick = () => handleClozeClick(team, btn, l);
      kb.appendChild(btn);
    });
  }

  function handleClozeClick(team, btn, char) {
    if (isAnsweringLocked) return;
    let progress = teamProgress[team];
    let expectedChar = clozeData.missing[progress];

    if (char === expectedChar) {
      let targetIndex = clozeData.indices[progress];
      teamDisplayChars[team][targetIndex] = char;
      teamProgress[team]++;
      updateClozeDisplay(team);

      if (teamProgress[team] === clozeData.missing.length) {
        triggerCorrectAnswer(team);
      }
    } else {
      btn.classList.add('wrong');
      setTimeout(() => btn.classList.remove('wrong'), 300);
    }
  }

  /* --- 共通答對處理邏輯 --- */
  function triggerCorrectAnswer(team) {
    isAnsweringLocked = true;
    clearInterval(timerInterval); 
    activeTurnTeam = team === 'blue' ? 'BLUE' : 'RED';
    
    if ('speechSynthesis' in window) {
      try {
        const u = new SpeechSynthesisUtterance("Good job!");
        u.lang = 'en-US';
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }
    grantPlacementTurn(activeTurnTeam);
  }

  function speakCurrentWord() {
    if ('speechSynthesis' in window && currentTargetWord) {
      try {
        const u = new SpeechSynthesisUtterance(currentTargetWord.en);
        u.lang = 'en-US';
        u.rate = currentGameMode === 'choice' ? 0.75 : 0.85;
        window.speechSynthesis.speak(u);
      } catch (e) {
        console.log("語音播放暫時無法使用", e);
      }
    }
  }

  function startPlacementTimer() {
    clearInterval(placementTimerInterval);
    placementTimeLeft = 5;
    document.getElementById('timerDisplay').innerText = `⏳ 擺棋 ${placementTimeLeft}`;

    placementTimerInterval = setInterval(() => {
      placementTimeLeft--;
      document.getElementById('timerDisplay').innerText = `⏳ 擺棋 ${placementTimeLeft}`;

      if (placementTimeLeft <= 0) {
        clearInterval(placementTimerInterval);
        activeTurnTeam = null;
        movingSourceIdx = null;
        isAnsweringLocked = false;
        document.getElementById('guideText').innerText = "⏰ 擺棋時間到！換下一題！";
        updateBoardUI();
        setTimeout(loadNextQuiz, 600);
      }
    }, 1000);
  }

  function grantPlacementTurn(team) {
    const isBlue = team === 'BLUE';
    const teamName = isBlue ? '🔵 藍隊' : '🔴 紅隊';
    const count = getTokensCount(team);
    
    startPlacementTimer(); 
    
    if (count < 3) {
      document.getElementById('guideText').innerText = `👉 ${teamName} 答對！場上有 ${count}/3 子，請點任一【空白格】放棋子！`;
    } else {
      document.getElementById('guideText').innerText = `⚠️ ${teamName} 答對！已滿 3 子，請先點自己的【舊棋子】進行移動！`;
    }
    updateBoardUI();
  }

  function handleCellClick(index) {
    if (!activeTurnTeam) return;

    const count = getTokensCount(activeTurnTeam);

    if (count < 3) {
      if (board[index] === null) {
        board[index] = activeTurnTeam;
        finalizeMove();
      }
      return;
    }

    if (count === 3) {
      if (movingSourceIdx === null) {
        if (board[index] === activeTurnTeam) {
          movingSourceIdx = index;
          document.getElementById('guideText').innerText = "已選定棋子！請點任一【空白格】完成移動！";
          updateBoardUI();
        }
      } else {
        if (board[index] === null) {
          board[movingSourceIdx] = null;
          board[index] = activeTurnTeam;
          movingSourceIdx = null;
          finalizeMove();
        } else if (board[index] === activeTurnTeam) {
          movingSourceIdx = index;
          updateBoardUI();
        }
      }
    }
  }

  function finalizeMove() {
    clearInterval(placementTimerInterval);
    updateBoardUI();

    if (checkWin(activeTurnTeam)) {
      triggerWin(activeTurnTeam);
      return;
    }
    loadNextQuiz();
  }

  function triggerWin(team) {
    clearInterval(timerInterval);
    clearInterval(placementTimerInterval);
    document.getElementById('winTitle').innerText = team === 'BLUE' ? '🔵 藍隊獲勝！' : '🔴 紅隊獲勝！';
    document.getElementById('winModal').style.display = 'flex';
    
    if (typeof confetti === 'function') {
      confetti({
        particleCount: 150,
        spread: 180,
        origin: { y: 0.1 },
        colors: team === 'BLUE' ? ['#1E90FF', '#ffffff', '#4A90E2'] : ['#FF4757', '#ffffff', '#FF6B81']
      });
    }
  }

  function getTokensCount(team) {
    return board.filter(c => c === team).length;
  }

  function updateBoardUI() {
    document.getElementById('tokensBlue').innerText = getTokensCount('BLUE');
    document.getElementById('tokensRed').innerText = getTokensCount('RED');

    const cells = document.querySelectorAll('.cell');
    cells.forEach((cell, idx) => {
      cell.className = 'cell';
      cell.innerHTML = ''; 

      if (board[idx] === 'BLUE') {
        cell.classList.add('token-blue');
        cell.innerHTML = '<div class="cell-token"></div>'; 
      } else if (board[idx] === 'RED') {
        cell.classList.add('token-red');
        cell.innerHTML = '<div class="cell-token"></div>'; 
      }

      if (activeTurnTeam && getTokensCount(activeTurnTeam) === 3) {
        if (movingSourceIdx === null && board[idx] === activeTurnTeam) {
          cell.classList.add('token-selectable');
        } else if (movingSourceIdx === idx) {
          cell.classList.add('token-selected');
        }
      }
    });
  }

  function checkWin(team) {
    const lines = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];
    return lines.some(([a, b, c]) => board[a] === team && board[b] === team && board[c] === team);
  }
  window.addEventListener('DOMContentLoaded', () => {
    loadConfigFromUrl();
  });

</script>
